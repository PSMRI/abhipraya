<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="980" viewBox="0 0 1536 980" role="img" aria-labelledby="title description">
  <title id="title">Abhipraya deployment architecture</title>
  <desc id="description">Provider-neutral deployment architecture showing source control, validation, release package, deployment approval, development, UAT and production environments, and operational controls.</desc>
  <defs><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#e8f3ff"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop stop-color="#f4fff8"/><stop offset="1" stop-color="#e7f8ed"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#fff4df"/></linearGradient><linearGradient id="purple" x1="0" x2="1"><stop stop-color="#fbf9ff"/><stop offset="1" stop-color="#eee7ff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#26384f"/></marker><style>.title{font:700 39px Arial,sans-serif;fill:#09295d;letter-spacing:1px}.heading{font:700 21px Arial,sans-serif;fill:#10213d}.sub{font:400 16px Arial,sans-serif;fill:#22344b}.small{font:400 14px Arial,sans-serif;fill:#22344b}.label{font:700 17px Arial,sans-serif;fill:#0f4da0}.box{stroke-width:1.5}.line{stroke:#26384f;stroke-width:2.1;fill:none;marker-end:url(#arrow)}.dash{stroke:#4c789a;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1536" height="980" fill="#fff"/><text x="768" y="53" text-anchor="middle" class="title">ABHIPRAYA - DEPLOYMENT ARCHITECTURE</text><text x="768" y="81" text-anchor="middle" class="sub">Controlled release flow for conventional PHP or optional container-based delivery</text>
  <rect x="105" y="122" width="285" height="144" rx="11" fill="url(#blue)" stroke="#2473c9" class="box"/><text x="247" y="164" text-anchor="middle" class="heading">1. Source control</text><text x="247" y="193" text-anchor="middle" class="sub">Git repository</text><text x="247" y="219" text-anchor="middle" class="small">Code, migrations, docs, config</text><text x="247" y="241" text-anchor="middle" class="small">Protected review and approval</text>
  <rect x="500" y="122" width="285" height="144" rx="11" fill="url(#green)" stroke="#238051" class="box"/><text x="642" y="164" text-anchor="middle" class="heading">2. Build and validate</text><text x="642" y="193" text-anchor="middle" class="sub">CI workflow or release script</text><text x="642" y="219" text-anchor="middle" class="small">Composer, PHP lint, checks</text><text x="642" y="241" text-anchor="middle" class="small">Test evidence and build logs</text>
  <rect x="895" y="122" width="285" height="144" rx="11" fill="url(#gold)" stroke="#d18400" class="box"/><text x="1037" y="164" text-anchor="middle" class="heading">3. Approved release</text><text x="1037" y="193" text-anchor="middle" class="sub">Versioned package</text><text x="1037" y="219" text-anchor="middle" class="small">Archive or optional image</text><text x="1037" y="241" text-anchor="middle" class="small">Dependency and licence review</text>
  <path d="M390 194H500" class="line"/><path d="M785 194H895" class="line"/><text x="439" y="177" text-anchor="middle" class="small">commit / merge</text><text x="837" y="177" text-anchor="middle" class="small">approved build</text>
  <rect x="1230" y="122" width="190" height="144" rx="11" fill="url(#purple)" stroke="#7546be" class="box"/><text x="1325" y="164" text-anchor="middle" class="heading">4. Promote</text><text x="1325" y="193" text-anchor="middle" class="sub">Release approval</text><text x="1325" y="219" text-anchor="middle" class="small">Change record</text><text x="1325" y="241" text-anchor="middle" class="small">Rollback plan</text><path d="M1180 194H1230" class="line"/>
  <path d="M1325 266V332H768V383" class="line"/>
  <rect x="105" y="383" width="1315" height="300" rx="12" fill="none" stroke="#6f8ba5" stroke-dasharray="7 5"/><text x="130" y="414" class="label">DEPLOYMENT ENVIRONMENTS</text>
  <rect x="160" y="452" width="340" height="180" rx="11" fill="url(#blue)" stroke="#397fc6" class="box"/><text x="330" y="492" text-anchor="middle" class="heading">Development</text><text x="330" y="523" text-anchor="middle" class="sub">Developer integration environment</text><text x="330" y="551" text-anchor="middle" class="small">Feature verification and migration checks</text><text x="330" y="577" text-anchor="middle" class="small">Non-production configuration/data</text>
  <rect x="598" y="452" width="340" height="180" rx="11" fill="url(#gold)" stroke="#d18400" class="box"/><text x="768" y="492" text-anchor="middle" class="heading">UAT / staging</text><text x="768" y="523" text-anchor="middle" class="sub">Business and security acceptance</text><text x="768" y="551" text-anchor="middle" class="small">Release candidate and test evidence</text><text x="768" y="577" text-anchor="middle" class="small">Production-like route and HTTPS checks</text>
  <rect x="1036" y="452" width="340" height="180" rx="11" fill="url(#green)" stroke="#238051" class="box"/><text x="1206" y="492" text-anchor="middle" class="heading">Production</text><text x="1206" y="523" text-anchor="middle" class="sub">Public service and administrators</text><text x="1206" y="551" text-anchor="middle" class="small">Restricted secrets and database access</text><text x="1206" y="577" text-anchor="middle" class="small">Health checks and controlled rollback</text>
  <path d="M500 542H598" class="line"/><path d="M938 542H1036" class="line"/><text x="549" y="525" text-anchor="middle" class="small">promote</text><text x="987" y="525" text-anchor="middle" class="small">release</text>
  <path d="M330 632V739" class="dash"/><path d="M768 632V739" class="dash"/><path d="M1206 632V739" class="dash"/>
  <rect x="105" y="739" width="390" height="128" rx="11" fill="url(#purple)" stroke="#7546be" class="box"/><text x="300" y="781" text-anchor="middle" class="heading">Runtime deployment choice</text><text x="300" y="810" text-anchor="middle" class="sub">Conventional PHP host, or optional</text><text x="300" y="836" text-anchor="middle" class="sub">container/orchestration platform</text>
  <rect x="572" y="739" width="390" height="128" rx="11" fill="url(#blue)" stroke="#397fc6" class="box"/><text x="767" y="781" text-anchor="middle" class="heading">Secure operations</text><text x="767" y="810" text-anchor="middle" class="sub">HTTPS, route rules, .env protection</text><text x="767" y="836" text-anchor="middle" class="sub">Database migrations and health checks</text>
  <rect x="1039" y="739" width="381" height="128" rx="11" fill="url(#blue)" stroke="#397fc6" class="box"/><text x="1229" y="781" text-anchor="middle" class="heading">Observe and recover</text><text x="1229" y="810" text-anchor="middle" class="sub">Monitoring, audit logs, backups</text><text x="1229" y="836" text-anchor="middle" class="sub">Restore tests and incident response</text>
</svg>
