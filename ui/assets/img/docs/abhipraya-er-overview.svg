<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">Abhipraya entity relationship diagram</title><desc id="desc">Classic ER diagram for the five active Abhipraya tables and their enforced or logical relationships.</desc>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity=".18"/></filter><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5d7185"/></marker><style>.ttl{font:700 31px Arial;fill:#16375e}.th{font:700 17px Arial;fill:#fff}.f{font:14px Consolas,monospace;fill:#253b53}.k{font:700 13px Arial;fill:#a36b00}.note{font:14px Arial;fill:#4a6178}.tbl{fill:#fff;stroke:#416d9f;stroke-width:1.7}.head{fill:#24588f}.row{stroke:#d9e2eb;stroke-width:1}.rel{fill:none;stroke:#5d7185;stroke-width:2.4;marker-end:url(#arr)}.logical{fill:none;stroke:#8d62b6;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#arr)}</style></defs>
<rect width="1600" height="940" fill="#f8fbff"/><text x="800" y="48" text-anchor="middle" class="ttl">ABHIPRAYA — ENTITY RELATIONSHIP DIAGRAM</text><text x="800" y="76" text-anchor="middle" class="note">Active application data model · solid = database foreign key · dashed = logical JSON/configuration reference</text>

<!-- auth_login_attempts -->
<g filter="url(#sh)"><rect x="85" y="170" width="290" height="188" rx="4" class="tbl"/><rect x="85" y="170" width="290" height="38" rx="4" class="head"/><text x="230" y="196" text-anchor="middle" class="th">auth_login_attempts</text><path d="M85 237H375M85 266H375M85 295H375M85 324H375" class="row"/><text x="102" y="228" class="k">PK</text><text x="135" y="228" class="f">username_hash</text><text x="102" y="257" class="k">PK</text><text x="135" y="257" class="f">ip_hash</text><text x="102" y="286" class="f">failed_attempts</text><text x="102" y="315" class="f">locked_until</text><text x="102" y="344" class="f">last_attempt_at</text></g>

<!-- user_master -->
<g filter="url(#sh)"><rect x="605" y="130" width="320" height="247" rx="4" class="tbl"/><rect x="605" y="130" width="320" height="38" rx="4" class="head"/><text x="765" y="156" text-anchor="middle" class="th">user_master</text><path d="M605 197H925M605 226H925M605 255H925M605 284H925M605 313H925M605 342H925" class="row"/><text x="622" y="188" class="k">PK</text><text x="655" y="188" class="f">u_id</text><text x="622" y="217" class="f">u_name</text><text x="622" y="246" class="f">u_pass</text><text x="622" y="275" class="f">active</text><text x="622" y="304" class="f">u_role</text><text x="622" y="333" class="f">NIN_fk</text><text x="622" y="362" class="f">u_identity</text></g>

<!-- secure profile -->
<g filter="url(#sh)"><rect x="1130" y="155" width="350" height="224" rx="4" class="tbl"/><rect x="1130" y="155" width="350" height="38" rx="4" class="head"/><text x="1305" y="181" text-anchor="middle" class="th">user_profile_secure</text><path d="M1130 222H1480M1130 251H1480M1130 280H1480M1130 309H1480M1130 338H1480" class="row"/><text x="1147" y="213" class="k">PK / FK</text><text x="1215" y="213" class="f">user_id</text><text x="1147" y="242" class="f">first_name_encrypted</text><text x="1147" y="271" class="f">email_encrypted</text><text x="1147" y="300" class="f">mobile_encrypted</text><text x="1147" y="329" class="f">job_title_encrypted</text><text x="1147" y="358" class="f">updated_at</text></g>

<!-- JSON config -->
<g filter="url(#sh)"><rect x="575" y="470" width="390" height="126" rx="4" fill="#fcf8ff" stroke="#8660ad" stroke-width="1.7"/><rect x="575" y="470" width="390" height="38" rx="4" fill="#7753a1"/><text x="770" y="496" text-anchor="middle" class="th">versioned JSON configuration</text><path d="M575 537H965M575 566H965" class="row"/><text x="592" y="528" class="f">service locations and service areas</text><text x="592" y="557" class="f">survey_code, version, schema hash</text><text x="592" y="586" class="f">roles, labels, survey packages</text></g>

<!-- responses -->
<g filter="url(#sh)"><rect x="180" y="690" width="410" height="204" rx="4" class="tbl"/><rect x="180" y="690" width="410" height="38" rx="4" class="head"/><text x="385" y="716" text-anchor="middle" class="th">srvy_responses</text><path d="M180 757H590M180 786H590M180 815H590M180 844H590M180 873H590" class="row"/><text x="197" y="748" class="k">PK</text><text x="230" y="748" class="f">id</text><text x="197" y="777" class="f">submission_id (unique)</text><text x="197" y="806" class="f">hospital_nin · department_id</text><text x="197" y="835" class="f">survey_code · survey_version</text><text x="197" y="864" class="f">survey_schema_hash</text><text x="197" y="887" class="f">srvy_Q0 … srvy_Q30</text></g>

<!-- capa -->
<g filter="url(#sh)"><rect x="1010" y="690" width="410" height="204" rx="4" class="tbl"/><rect x="1010" y="690" width="410" height="38" rx="4" class="head"/><text x="1215" y="716" text-anchor="middle" class="th">capa_actions</text><path d="M1010 757H1420M1010 786H1420M1010 815H1420M1010 844H1420M1010 873H1420" class="row"/><text x="1027" y="748" class="k">PK</text><text x="1060" y="748" class="f">id</text><text x="1027" y="777" class="f">hospital_nin · dept_id</text><text x="1027" y="806" class="f">month · question_key</text><text x="1027" y="835" class="f">survey_code · survey_version</text><text x="1027" y="864" class="f">survey_schema_hash</text><text x="1027" y="887" class="f">root_cause · action_plan</text></g>

<path d="M925 252H1130" class="rel"/><text x="1025" y="239" text-anchor="middle" class="note">1 : 0..1</text><path d="M690 377V470" class="logical"/><path d="M865 377V470" class="logical"/><path d="M650 596V650H385V690" class="logical"/><path d="M890 596V650H1215V690" class="logical"/><text x="490" y="640" text-anchor="middle" class="note">logical context</text><text x="1080" y="640" text-anchor="middle" class="note">logical context</text><text x="800" y="925" text-anchor="middle" class="note">`auth_login_attempts` is intentionally independent so failed sign-ins for unknown users can be rate-limited.</text>
</svg>
