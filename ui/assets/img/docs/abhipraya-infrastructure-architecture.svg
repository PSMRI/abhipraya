<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1080" viewBox="0 0 1536 1080" role="img" aria-labelledby="title description">
  <title id="title">Abhipraya infrastructure architecture</title>
  <desc id="description">Cloud-style reference infrastructure for Abhipraya with DNS, HTTPS edge, load balancer, private application nodes, private database, configuration storage, backups, and monitoring.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#e8f3ff"/></linearGradient><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#fff8f8"/><stop offset="1" stop-color="#ffecec"/></linearGradient><linearGradient id="private" x1="0" x2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#e7f3ff"/></linearGradient><linearGradient id="data" x1="0" x2="1"><stop stop-color="#fbf8ff"/><stop offset="1" stop-color="#f0e9ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#26384f"/></marker>
    <style>.title{font:700 39px Arial,sans-serif;fill:#09295d;letter-spacing:1px}.heading{font:700 21px Arial,sans-serif;fill:#11213d}.sub{font:400 16px Arial,sans-serif;fill:#22344c}.small{font:400 14px Arial,sans-serif;fill:#22344c}.label{font:700 17px Arial,sans-serif;fill:#0f4da0}.box{stroke-width:1.5}.line{stroke:#26384f;stroke-width:2.1;fill:none;marker-end:url(#arrow)}.dash{stroke:#4b789a;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1536" height="1080" fill="#fff"/><text x="768" y="52" text-anchor="middle" class="title">ABHIPRAYA - INFRASTRUCTURE ARCHITECTURE</text><text x="768" y="80" text-anchor="middle" class="sub">Cloud-style scalable reference deployment - provider and platform neutral</text>

  <text x="100" y="133" class="heading">Users</text><circle cx="115" cy="162" r="15" fill="#0c4ca5"/><circle cx="150" cy="162" r="15" fill="#0c4ca5"/><path d="M89 204q6-31 26-31t26 31M124 204q6-31 26-31t26 31" fill="#0c4ca5"/><text x="115" y="231" class="small">Public and administrators</text>
  <path d="M245 175H315" class="line"/><text x="252" y="158" class="small">https://feedback.example.org</text>
  <rect x="315" y="123" width="185" height="96" rx="10" fill="url(#sky)" stroke="#2e73ca" class="box"/><text x="407" y="161" text-anchor="middle" class="heading">Domain and DNS</text><text x="407" y="188" text-anchor="middle" class="sub">Public service address</text>
  <path d="M500 171H585V254" class="line"/>

  <rect x="158" y="254" width="1220" height="725" rx="8" fill="none" stroke="#7890a7" stroke-dasharray="6 5"/><text x="178" y="281" class="label">SECURE DEPLOYMENT ENVIRONMENT</text>
  <rect x="190" y="300" width="1156" height="202" rx="11" fill="url(#edge)" stroke="#dd5961" class="box"/><text x="214" y="330" class="label" fill="#b32734">PUBLIC EDGE / DMZ</text>
  <rect x="280" y="352" width="286" height="110" rx="9" fill="#fff" stroke="#e06a70" class="box"/><text x="423" y="390" text-anchor="middle" class="heading">HTTPS load balancer</text><text x="423" y="418" text-anchor="middle" class="sub">TLS certificates and health checks</text><text x="423" y="441" text-anchor="middle" class="small">Optional WAF and rate limiting</text>
  <rect x="700" y="352" width="475" height="110" rx="9" fill="#fff" stroke="#e06a70" class="box"/><text x="937" y="390" text-anchor="middle" class="heading">Web-server / reverse-proxy rules</text><text x="937" y="418" text-anchor="middle" class="sub">IIS, Apache, Nginx, or compatible proxy</text><text x="937" y="441" text-anchor="middle" class="small">Public, administrator, and API routes</text>
  <path d="M585 254V407H700" class="line"/><path d="M700 407H566" class="line"/><path d="M937 462V534" class="line"/>

  <rect x="190" y="534" width="760" height="386" rx="11" fill="url(#private)" stroke="#3178c6" class="box"/><text x="214" y="565" class="label">PRIVATE APPLICATION NETWORK</text><text x="214" y="589" class="small">No direct public database access</text>
  <rect x="246" y="628" width="195" height="186" rx="9" fill="#fff" stroke="#528cca" class="box"/><text x="344" y="667" text-anchor="middle" class="heading">Application node 1</text><text x="344" y="696" text-anchor="middle" class="sub">PHP UI and API</text><text x="344" y="721" text-anchor="middle" class="small">Sessions, survey, analytics</text><text x="344" y="746" text-anchor="middle" class="small">CAPA and audit services</text><text x="344" y="781" text-anchor="middle" class="small">Private subnet</text>
  <rect x="505" y="628" width="195" height="186" rx="9" fill="#fff" stroke="#528cca" class="box"/><text x="602" y="667" text-anchor="middle" class="heading">Application node 2</text><text x="602" y="696" text-anchor="middle" class="sub">Optional scale-out</text><text x="602" y="721" text-anchor="middle" class="small">Same controlled release</text><text x="602" y="746" text-anchor="middle" class="small">Stateless request handling</text><text x="602" y="781" text-anchor="middle" class="small">Private subnet</text>
  <rect x="764" y="628" width="140" height="186" rx="9" fill="#fff" stroke="#528cca" class="box"/><text x="834" y="667" text-anchor="middle" class="heading">Autoscale</text><text x="834" y="696" text-anchor="middle" class="sub">Optional</text><text x="834" y="730" text-anchor="middle" class="small">Add nodes</text><text x="834" y="752" text-anchor="middle" class="small">as demand</text><text x="834" y="774" text-anchor="middle" class="small">increases</text>
  <path d="M937 534V584H344V628" class="line"/><path d="M937 584H602V628" class="line"/>

  <rect x="990" y="534" width="356" height="386" rx="11" fill="url(#data)" stroke="#7748be" class="box"/><text x="1014" y="565" class="label" fill="#6734a8">PRIVATE DATA SERVICES</text>
  <rect x="1030" y="610" width="276" height="112" rx="9" fill="#fff" stroke="#9065c6" class="box"/><text x="1168" y="650" text-anchor="middle" class="heading">MySQL or MariaDB</text><text x="1168" y="678" text-anchor="middle" class="sub">Responses, users, QR, CAPA</text><text x="1168" y="701" text-anchor="middle" class="small">Least-privilege application account</text>
  <rect x="1030" y="758" width="276" height="112" rx="9" fill="#fff" stroke="#9065c6" class="box"/><text x="1168" y="798" text-anchor="middle" class="heading">Configuration storage</text><text x="1168" y="826" text-anchor="middle" class="sub">JSON surveys, labels, roles</text><text x="1168" y="849" text-anchor="middle" class="small">Controlled deployment access</text>
  <path d="M700 720H1030" class="line"/><path d="M700 776H1030" class="line"/>
  <path d="M1168 722V946" class="dash"/><path d="M834 814V946" class="dash"/>

  <rect x="250" y="946" width="450" height="92" rx="10" fill="url(#sky)" stroke="#347fc7" class="box"/><text x="475" y="984" text-anchor="middle" class="heading">Monitoring and security operations</text><text x="475" y="1011" text-anchor="middle" class="sub">Availability, logs, failed access, incident response</text>
  <rect x="838" y="946" width="450" height="92" rx="10" fill="url(#sky)" stroke="#347fc7" class="box"/><text x="1063" y="984" text-anchor="middle" class="heading">Backup and recovery storage</text><text x="1063" y="1011" text-anchor="middle" class="sub">Database/configuration backups and restore tests</text>
</svg>
