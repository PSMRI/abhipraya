<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title description">
  <title id="title">Abhipraya technical architecture</title>
  <desc id="description">Public beneficiaries and administrators access Abhipraya through the user interface and IIS routing. Versioned APIs use security, service, configuration and repository layers to access JSON configuration and MySQL transactional data.</desc>
  <style>
    .bg{fill:#f6f9fc}.title{font:700 31px Arial,sans-serif;fill:#073b67}.sub{font:400 16px Arial,sans-serif;fill:#52657f}.box{fill:#fff;stroke:#cbddea;stroke-width:2}.public{fill:#e8f5fb;stroke:#15729c}.admin{fill:#eef7ed;stroke:#3c873e}.route{fill:#fff4dd;stroke:#c98200}.api{fill:#edf1ff;stroke:#4768c8}.core{fill:#f6edff;stroke:#8246af}.config{fill:#eaf9f5;stroke:#16856e}.data{fill:#fff0f0;stroke:#bf4c4c}.heading{font:700 18px Arial,sans-serif;fill:#123956}.body{font:400 14px Arial,sans-serif;fill:#43546c}.small{font:400 13px Arial,sans-serif;fill:#43546c}.arrow{fill:none;stroke:#397195;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7d8fa1;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 z" fill="#397195"/></marker></defs>
  <rect class="bg" width="1400" height="940" rx="24"/>
  <text x="700" y="55" text-anchor="middle" class="title">Abhipraya technical architecture</text>
  <text x="700" y="82" text-anchor="middle" class="sub">Anonymous QR feedback → interpreted insights → corrective action</text>
  <rect x="90" y="125" width="360" height="135" rx="16" class="box public"/>
  <text x="270" y="164" text-anchor="middle" class="heading">Public beneficiary</text>
  <text x="270" y="193" text-anchor="middle" class="body">Scans department QR</text>
  <text x="270" y="216" text-anchor="middle" class="body">Selects language · submits anonymous feedback</text>
  <text x="270" y="239" text-anchor="middle" class="small">Location / duplicate validation where configured</text>
  <rect x="950" y="125" width="360" height="135" rx="16" class="box admin"/>
  <text x="1130" y="164" text-anchor="middle" class="heading">Authorised official</text>
  <text x="1130" y="193" text-anchor="middle" class="body">Home · QR Center · Analytics · Reports</text>
  <text x="1130" y="216" text-anchor="middle" class="body">CAPA · Profile</text>
  <text x="1130" y="239" text-anchor="middle" class="small">Server-enforced role and facility scope</text>
  <path d="M270 260 L270 325" class="arrow"/><path d="M1130 260 L1130 325" class="arrow"/>
  <rect x="315" y="325" width="770" height="102" rx="16" class="box route"/>
  <text x="700" y="365" text-anchor="middle" class="heading">IIS web server and route layer</text>
  <text x="700" y="393" text-anchor="middle" class="body">Public `/survey` and legacy `question.php` · protected `/admin/*` · documentation `/docs/README.md`</text>
  <path d="M700 427 L700 490" class="arrow"/>
  <rect x="315" y="490" width="770" height="110" rx="16" class="box api"/>
  <text x="700" y="530" text-anchor="middle" class="heading">Versioned REST API · `/api/v1/`</text>
  <text x="700" y="558" text-anchor="middle" class="body">Auth · Public Survey · QR · Analytics · Responses · CAPA</text>
  <text x="700" y="581" text-anchor="middle" class="small">Allow-listed routes · JSON responses · server-side scope enforcement</text>
  <path d="M700 600 L700 660" class="arrow"/>
  <rect x="315" y="660" width="770" height="120" rx="16" class="box core"/>
  <text x="700" y="700" text-anchor="middle" class="heading">Core, service and repository layers</text>
  <text x="700" y="728" text-anchor="middle" class="body">Sessions · authentication · CSRF · security headers · validation · configuration loader</text>
  <text x="700" y="751" text-anchor="middle" class="body">Analytics interpretation · prepared database access · audit and error handling</text>
  <path d="M500 780 L320 845" class="arrow"/><path d="M900 780 L1080 845" class="arrow"/>
  <rect x="70" y="845" width="500" height="70" rx="14" class="box config"/>
  <text x="320" y="874" text-anchor="middle" class="heading">JSON configuration</text>
  <text x="320" y="897" text-anchor="middle" class="small">Facilities · departments · roles · radius · survey packages and versions</text>
  <rect x="830" y="845" width="500" height="70" rx="14" class="box data"/>
  <text x="1080" y="874" text-anchor="middle" class="heading">MySQL transactional data</text>
  <text x="1080" y="897" text-anchor="middle" class="small">Users · responses · survey version/hash · CAPA · login protection</text>
</svg>
